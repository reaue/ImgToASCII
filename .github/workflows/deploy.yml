name: Deploy ImgToASCII

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Google API key
        env:
          API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "ERROR: GOOGLE_API_KEY secret is empty or unavailable."
            exit 1
          fi

          sed -i "s|__GOOGLE_API_KEY__|$API_KEY|g" script.js

          if grep -q "__GOOGLE_API_KEY__" script.js; then
            echo "ERROR: API key placeholder was not replaced."
            exit 1
          fi

          echo "API key successfully injected."
        
      - name: Check injected key
        run: |
          echo "Checking script.js..."

          if grep -q "__GOOGLE_API_KEY__" script.js; then
            echo "ERROR: Placeholder still present!"
            exit 1
          fi

          echo "Placeholder successfully removed."

          grep "const KEY" script.js | sed 's/=.*/= [HIDDEN];/'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4