<!doctype html>

<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- This ensure that the page render with the correct width of the browser viewport -->
        <link href="style.css" rel="stylesheet" />
        <script defer src="script.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <title>ImgToASCII</title>
    </head>
    <body>
        <div>
            <header class="title">
                <h1>█▓▒░  ASCII.convert</h1>
            </header>

            <main>
                <label for="input-file" class="drop-zone" id="drop-zone">
                    <pre aria-hidden="true">@%#*+=-:.,@%
%#*+=-:.;@%#
#*+=-:.~@%#*
*+=-:.?@%#*+</pre>
                    <h2>CLICK TO LOAD IMAGE</h2>
                    <p>JPG · PNG · MORE</p>
                </label>
                <input type="file" id="input-file" accept="image/*, video/*" style="display: none;" />
                
                <canvas id="sampling-canvas" style="display: none"></canvas>
                <canvas id="output-canvas">Your browser doesn't support canvas.</canvas>

                <div class="slidercontainer">
                    <input type="range" min="1" max="100" value="50" class="slider" id="Size" aria-label="Taille des blocs" />
                    <p>Size : <span id="value">50</span></p>
                    <div class="info-container">
                        🛈
                        <span class="info-text">The size is the level of details, how much pixel for a character</span>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
